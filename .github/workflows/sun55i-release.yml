name: Sun55i ARM64 release

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sun55i-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: sun55i-web-dist
          path: web/dist
          if-no-files-found: error

  arm64:
    runs-on: ubuntu-22.04
    needs: frontend
    timeout-minutes: 180
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sun55i-web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sun55i-arm64-release
          cache-all-crates: true
      - name: Set release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          package_version="${base_version}+sun55i$(date -u +%Y%m%d%H%M%S).${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          dpkg --validate-version "$package_version"
          echo "ONE_KVM_SUN55I_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "release_tag=sun55i-v$package_version" >> "$GITHUB_OUTPUT"
      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Build ARM64 binary
        run: bash build/build-images.sh arm64
      - name: Package and verify deb
        shell: bash
        env:
          ONE_KVM_SUN55I_CEDAR: '1'
        run: |
          set -euo pipefail
          bash build/package-deb.sh arm64
          deb="target/debian/one-kvm-sun55i_${ONE_KVM_SUN55I_VERSION}_arm64.deb"
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = one-kvm-sun55i
          test "$(dpkg-deb -f "$deb" Architecture)" = arm64
          test "$(dpkg-deb -f "$deb" Version)" = "$ONE_KVM_SUN55I_VERSION"
          dpkg-deb -f "$deb" Depends | grep -F 'avaota-cedar-encoder'
          grep -aFq 'libavaota-cedar-bridge.so' target/aarch64-unknown-linux-gnu/release/one-kvm
          cd target/debian
          sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: one-kvm-sun55i-arm64-deb
          path: |
            target/debian/one-kvm-sun55i_*_arm64.deb
            target/debian/one-kvm-sun55i_*_arm64.deb.sha256
          if-no-files-found: error

  release:
    runs-on: ubuntu-22.04
    needs: arm64
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: one-kvm-sun55i-arm64-deb
          path: release-artifacts
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.arm64.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release-artifacts/*.deb release-artifacts/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes 'Sun55i ARM64 build with Cedar H.264 encoder support.'
